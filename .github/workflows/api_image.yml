name: Build API image

# The data is baked into the image, so a data refresh and a code change are the same
# event: rebuild and push. Deployment is then `docker compose pull && up -d`.
on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "data/processed/forecasts.parquet"
      - "data/processed/forecast_metrics.parquet"
      - "data/processed/list_size.parquet"
      - "data/processed/mapping.parquet"
      - "pipeline/entities.py"
      - "pipeline/config.py"
      - "scripts/build_serving_db.py"
      - "requirements-api.txt"
      - "Dockerfile"
      - ".github/workflows/api_image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Run the API tests before publishing: the image contains the data, so a broken
      # serving database would otherwise ship as a release.
      - name: Install test dependencies
        run: pip install -r requirements-api.txt pandas pyarrow pytest httpx

      - name: Build serving database
        run: python scripts/build_serving_db.py

      - name: Test
        run: pytest tests/test_api.py -q

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:latest
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
