# The monthly schedule now lives on a Windows Task Scheduler job driving
# scripts/local_refresh.ps1 — see docs/LOCAL_REFRESH.md.
#
# Cloudflare, in front of digital.nhs.uk, returns 403 to this runner on every attempt regardless of
# User-Agent (the same request from a residential IP returns 200, including with a bare curl UA), so
# a scheduled run here could only ever go red. The publication page cannot be bypassed either: the
# download URLs carry an opaque per-file hex segment that changes every month, so the links have to
# be scraped rather than reconstructed.
#
# workflow_dispatch is kept as a manual fallback — worth trying if the block ever lifts, and it is
# the only way to drive a specific month from CI.
name: Monthly NHS GP Data Pipeline

on:
  workflow_dispatch:
    inputs:
      month:
        description: "Month name or number"
        required: false
        default: ""
      year:
        description: "Year"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  monthly-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monthly pipeline
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.month }}" ]; then
            ARGS="$ARGS --month ${{ github.event.inputs.month }}"
          fi
          if [ -n "${{ github.event.inputs.year }}" ]; then
            ARGS="$ARGS --year ${{ github.event.inputs.year }}"
          fi
          python -m pipeline.monthly $ARGS

      - name: Re-join enrichment
        # A newly ingested month's mapping rows come straight from the NHS extract with no IMD or
        # ONSPD columns. Skipping this leaves IMD_DECILE all-NaN for the latest snapshot and the
        # next step dies inside cluster_practices, where SimpleImputer drops the all-NaN column.
        run: python scripts/join_enrichment.py

      - name: Rebuild dashboard cache
        run: python scripts/build_dashboard_cache.py --skip-anomalies

      - name: Detect data changes
        id: changes
        run: |
          if git diff --quiet -- data/processed/ data/pipeline_log.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push processed updates
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/ data/pipeline_log.json
          # No [skip ci]: a data push is the trigger a downstream forecast-cache workflow needs.
          git commit -m "data: monthly pipeline refresh"
          git push
